name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  cicd:
    uses: ckoliber/.github/.github/workflows/mise.yml@main
    permissions:
      contents: write
    with:
      fetch-depth: 0
      cache-tools: uv,go
      script: |
        mise run go:deps
        mise run go:test
        mise run go:build
        if [ "$GITHUB_EVENT_NAME" = push ]; then mise run release:cliff; fi
