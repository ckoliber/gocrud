include = ["git::https://github.com/ckoliber/.github.git//always.toml?ref=main"]
task_config.includes = [
  "git::https://github.com/ckoliber/.github.git//tasks?ref=main",
]

[tools]
go = "1.27.3"
uv = "0.13.7"
"pypi:mkdocs" = { version = "1.6.1", uvx_args = "--with mkdocs-material" }

[tasks."go:deps"]
run = "go get"

[tasks."go:test"]
run = "go test ./..."

[tasks."go:build"]
run = "go build"

[tasks."docs:build"]
dir = "{{ config_root }}/docs"
run = "mkdocs build"

[tasks."docs:start"]
dir = "{{ config_root }}/docs"
run = "mkdocs serve"

[tasks."docs:deploy"]
dir = "{{ config_root }}/docs"
run = "mkdocs gh-deploy --force"
